name: Super-Linter

on: [pull_request]

jobs:
    super-lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Run Super-Linter
              uses: github/super-linter/slim@v5
              env:
                  DEFAULT_BRANCH: main
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # JavaScript/TypeScript validation handled by Biome
                  # Only enable linters for non-JS/TS file types
                  VALIDATE_CSS: true
                  VALIDATE_MARKDOWN: true
                  VALIDATE_YAML: true
                  VALIDATE_JSON: true
